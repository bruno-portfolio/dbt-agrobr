name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DBT_PROFILES_DIR: profiles
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  FIXTURE: "{agrobr_dados: fixtures/dados}"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sqlfluff lint models macros tests
      - run: ruff check carga fixtures painel
      - run: ruff format --check carga fixtures painel

  carga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-carga.txt
      - run: pip install -r requirements-carga.txt
      - run: pytest carga

  dbt-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: dbt deps
      - run: dbt parse --target ci --vars "$FIXTURE"
      - run: dbt build --target ci --vars "$FIXTURE"

  dbt-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-v2.txt
      - run: dbt deps
      - run: dbt parse --target ci --vars "$FIXTURE"
      - run: dbt build --target ci --vars "$FIXTURE"
